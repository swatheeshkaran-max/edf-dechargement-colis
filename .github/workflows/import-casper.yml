name: Import Casper PDFs and EPR2 screening
on:
  push:
    paths:
      - 'casper_pdf/CASPER_SOURCES.csv'
      - 'casper_pdf/build_casper.py'
      - '.github/workflows/import-casper.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-casper:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download PDFs and generate workbook
        run: python casper_pdf/build_casper.py
      - name: Commit all downloaded source PDFs and generated results
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add casper_pdf/*.pdf casper_pdf/CASPER_CLASSIFICATION.csv casper_pdf/CASPER_SYNTHESIS.csv casper_pdf/CASPER_DOWNLOAD_FAILURES.csv casper_convois_epr2.xlsx
          git diff --cached --quiet || git commit -m "Import 10 Casper vessel PDFs and EPR2 classification workbook"
          git push
